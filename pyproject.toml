[project]
name = "repochat"
version = "0.1.0"
description = "A repository-aware RAG chatbot for Python and JavaScript GitHub repositories"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "bm25s>=0.2",
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
    "sentence-transformers>=3.0",
    "groq>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers>=4.0",
]

[project.scripts]
repochat = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "apps"]
