[project]
name = "repochat"
version = "0.1.0"
description = "A repository-aware RAG chatbot for Python and JavaScript GitHub repositories"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "bm25s>=0.2",
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
    "sentence-transformers>=3.0",
    "groq>=0.9",
    "python-dotenv>=1.0",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers>=4.0",
]

# `sentence-transformers` pulls in plain CPU-only torch as a transitive
# dependency. If this machine has a working CUDA GPU (check with
# `nvidia-smi`), reinstall torch for it AFTER `pip install -e .`, matching
# the CUDA branch your driver actually supports:
#   pip install --force-reinstall torch==2.14.0+cu126 \
#       --index-url https://download.pytorch.org/whl/cu126
# cu126 (CUDA 12.6) specifically -- not cu130/cu132 -- because CUDA 13
# dropped support for Pascal-generation GPUs (compute capability < 7.5,
# e.g. the GTX 10-series) entirely. sentence-transformers picks up a CUDA
# torch automatically once it's installed; no other code changes needed.

[project.scripts]
repochat = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "apps"]
